spring:
  application:
    name: authentication-and-authorization-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:10.212.10.135}:${DB_PORT:5432}/${DB_NAME:identity}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/identity-os

server:
  port: 8082

organization-auth:
  otp:
    expiry-seconds: ${ORG_OTP_EXPIRY_SECONDS:300}
    resend-seconds: ${ORG_OTP_RESEND_SECONDS:60}
    max-attempts: ${ORG_OTP_MAX_ATTEMPTS:5}
  mail:
    from: ${ORG_OTP_MAIL_FROM:no-reply@identity-os.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info

